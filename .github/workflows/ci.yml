name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify version consistency
        run: python scripts/check_version_consistency.py

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        if: matrix.python-version == '3.10'
        run: python -m mypy

      - name: Verify public API manifest
        run: python scripts/check_public_api.py

      - name: Verify test floor
        run: python scripts/check_test_count.py --minimum 700

      - name: Run deterministic concurrency regressions
        run: python -m pytest -m release_concurrency --tb=short

      - name: Run full test suite
        run: python -m pytest --tb=short

  package:
    name: Build and verify distributions
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify version consistency
        run: python scripts/check_version_consistency.py

      - name: Build wheel and source distribution
        run: python -m build

      - name: Install wheel in a clean environment and verify public API
        run: python scripts/verify_distribution.py

      - name: Upload verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: coalestra-distributions
          path: dist/*
          if-no-files-found: error
